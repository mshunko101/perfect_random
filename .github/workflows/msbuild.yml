name: MSBuild with Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '**.sln'
      - '**.vcxproj'
      - '.github/workflows/msbuild.yml'
  release:
    types: [created]

env:
  SOLUTION_FILE_PATH: ./src/Rand++.sln
  BUILD_CONFIGURATION: Release
  ARTIFACTS_DIR: artifacts

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: |
      github.event_name != 'release' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Find Visual Studio Installer
      id: vs-installer-path
      shell: powershell
      run: |
        $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vsWhere)) {
          Write-Error "vswhere.exe not found. Cannot proceed."
          exit 1
        }
        $path = & $vsWhere -latest -find setup.exe
        echo "installer_path=$path" >> $env:GITHUB_OUTPUT

    - name: Install MFC (VC.ATLMFC)
      shell: powershell
      run: |
        $installer = "${{ steps.vs-installer-path.outputs.installer_path }}"
        if (-not (Test-Path $installer)) {
          Write-Error "Visual Studio Installer not found at expected path."
          exit 1
        }
        Write-Host "Starting MFC installation..."
        & $installer modify --quiet `
          --add Microsoft.VisualStudio.Component.VC.ATLMFC `
          --wait
        Write-Host "MFC installation completed."

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build solution
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Create artifacts directory
      run: |
        New-Item -ItemType Directory -Force -Path ${{env.ARTIFACTS_DIR}}

    - name: Copy additional files from repository
      run: |
        Copy-Item -Path "README.md" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "LICENSE" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "randpp.h" -Destination "${{env.ARTIFACTS_DIR}}" -Force

    - name: Compress build output
      run: |
        $outputPath = ".\src\x64\${{env.BUILD_CONFIGURATION}}"
        $zipPath = "${{env.ARTIFACTS_DIR}}\build-artifacts.zip"

        if (Test-Path $outputPath) {
            Write-Host "Копируем бинарные файлы в директорию артефактов"
            Copy-Item -Path "$outputPath\*.exe" -Destination "${{env.ARTIFACTS_DIR}}" -Recurse -Force
            Write-Host "Архивируем все файлы из директории артефактов в $zipPath"
            Compress-Archive -Path "${{env.ARTIFACTS_DIR}}\*" -DestinationPath $zipPath -Force
            Write-Host "Архив успешно создан: $zipPath"
        } else {
            Write-Error "Выходная директория не найдена: $outputPath"
            exit 1
        }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Сборка проекта Rand++

          **Версия:** v${{ github.run_number }}
          **Дата сборки:** ${{ github.event.head_commit.timestamp }}
          **Коммит:** ${{ github.sha }}
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip
        draft: false
        prerelease: false

    - name: Upload Asset to existing Release
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip

    - name: Cleanup
      if: always()
      run: |
        if (Test-Path ${{env.ARTIFACTS_DIR}}) {
            Remove-Item -Path ${{env.ARTIFACTS_DIR}} -Recurse -Force
            Write-Host "Временные файлы очищены"
        }
