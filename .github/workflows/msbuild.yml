name: MSBuild with Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '**.sln'
      - '**.vcxproj'
      - '.github/workflows/msbuild.yml'
  release:
    types: [created]

env:
  SOLUTION_FILE_PATH: ./src/Rand++.sln
  BUILD_CONFIGURATION: Release
  ARTIFACTS_DIR: artifacts

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: |
      github.event_name != 'release' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build solution
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Generate test data (CLI mode)
      run: |
        $outputFile = Join-Path $PWD "test_data.bin"
        Write-Host "Generating test data to: $outputFile"
        .\src\x64\${{env.BUILD_CONFIGURATION}}\Rand++.exe -n 250000 -f bin -s dword -o $outputFile

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        pip install sp80022suite numpy scipy

    - name: Run NIST statistical tests
      shell: pwsh
      run: |
        python -c @'
        import sp80022suite
        import sys
        import os

        test_file = os.path.join(os.getcwd(), "test_data.bin")
        with open(test_file, "rb") as f:
            data = f.read()

        print(f"Read {len(data)} bytes from {test_file}")

        # Convert to bit sequence as bytes (each byte is 0 or 1)
        bits = bytes([(byte >> (7 - bit_pos)) & 1 for byte in data for bit_pos in range(8)])
        bits = bits[:1000000]
        print(f"Extracted {len(bits)} bits")

        results = []

        # 1-arg tests (data only, as bytes of 0/1)
        one_arg_tests = [
            ("Frequency",              sp80022suite.frequency),
            ("Runs",                   sp80022suite.runs),
            ("Longest Run of Ones",    sp80022suite.longest_run_of_ones),
            ("Rank",                   sp80022suite.rank),
            ("Universal",              sp80022suite.universal),
            ("Cumulative Sums",        sp80022suite.cumulative_sums),
            ("Random Excursions",      sp80022suite.random_excursions),
            ("Random Excursions Var",  sp80022suite.random_excursions_variant),
            ("Discrete Fourier",       sp80022suite.discrete_fourier_transform),
        ]

        for name, fn in one_arg_tests:
            try:
                p = fn(bits)
                if isinstance(p, (tuple, list)):
                    p = p[0]
                p = float(p)
                status = "PASS" if p >= 0.01 else "FAIL"
                print(f"{name:30s}  p={p:.6f}  {status}")
                results.append((name, p, status))
            except Exception as e:
                print(f"{name:30s}  ERROR: {e}")
                results.append((name, None, "ERROR"))

        # 2-arg tests (parameter + data)
        two_arg_tests = [
            ("Block Frequency",          sp80022suite.block_frequency,                    128),
            ("Non-Overlapping Template",  sp80022suite.non_overlapping_template_matchings, bytes([0]*8)),
            ("Overlapping Template",     sp80022suite.overlapping_template_matchings,    bytes([1]*9)),
            ("Linear Complexity",         sp80022suite.linear_complexity,                  500),
            ("Serial",                    sp80022suite.serial,                              16),
            ("Approximate Entropy",       sp80022suite.approximate_entropy,                16),
        ]

        for name, fn, param in two_arg_tests:
            try:
                p = fn(param, bits)
                if isinstance(p, (tuple, list)):
                    p = p[0]
                p = float(p)
                status = "PASS" if p >= 0.01 else "FAIL"
                print(f"{name:30s}  p={p:.6f}  {status}")
                results.append((name, p, status))
            except Exception as e:
                print(f"{name:30s}  ERROR: {e}")
                results.append((name, None, "ERROR"))

        print()
        failed = [r for r in results if r[2] != "PASS"]
        passed = [r for r in results if r[2] == "PASS"]

        print(f"Passed: {len(passed)} / {len(results)}")
        if failed:
            print(f"Failed: {len(failed)}")
            for name, p, status in failed:
                if p is not None:
                    print(f"  {name}: p={p:.6f} ({status})")
                else:
                    print(f"  {name}: {status}")
            sys.exit(1)
        else:
            print("All tests PASSED")
        '@

    - name: Create artifacts directory
      run: |
        New-Item -ItemType Directory -Force -Path ${{env.ARTIFACTS_DIR}}

    - name: Copy additional files from repository
      run: |
        Copy-Item -Path "README.md" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "LICENSE" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "randpp.h" -Destination "${{env.ARTIFACTS_DIR}}" -Force

    - name: Compress build output
      run: |
        $outputPath = ".\src\x64\${{env.BUILD_CONFIGURATION}}"
        $zipPath = "${{env.ARTIFACTS_DIR}}\build-artifacts.zip"

        if (Test-Path $outputPath) {
            Write-Host "Копируем бинарные файлы в директорию артефактов"
            Copy-Item -Path "$outputPath\*.exe" -Destination "${{env.ARTIFACTS_DIR}}" -Recurse -Force
            Write-Host "Архивируем все файлы из директории артефактов в $zipPath"
            Compress-Archive -Path "${{env.ARTIFACTS_DIR}}\*" -DestinationPath $zipPath -Force
            Write-Host "Архив успешно создан: $zipPath"
        } else {
            Write-Error "Выходная директория не найдена: $outputPath"
            exit 1
        }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Сборка проекта Rand++

          **Версия:** v${{ github.run_number }}
          **Дата сборки:** ${{ github.event.head_commit.timestamp }}
          **Коммит:** ${{ github.sha }}
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip
        draft: false
        prerelease: false

    - name: Upload Asset to existing Release
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip

    - name: Cleanup
      if: always()
      run: |
        if (Test-Path ${{env.ARTIFACTS_DIR}}) {
            Remove-Item -Path ${{env.ARTIFACTS_DIR}} -Recurse -Force
            Write-Host "Временные файлы очищены"
        }
        if (Test-Path "test_data.bin") {
            Remove-Item -Path "test_data.bin" -Force
        }
