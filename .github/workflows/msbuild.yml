name: MSBuild with Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '**.sln'
      - '**.vcxproj'
      - '.github/workflows/msbuild.yml'
  release:
    types: [created]

env:
  SOLUTION_FILE_PATH: ./src/Rand++.sln
  BUILD_CONFIGURATION: Release
  ARTIFACTS_DIR: artifacts

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: |
      github.event_name != 'release' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build solution
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Generate test data (CLI mode)
      run: |
        $outputFile = Join-Path $PWD "test_data.bin"
        Write-Host "Generating test data to: $outputFile"
        .\src\x64\${{env.BUILD_CONFIGURATION}}\Rand++.exe -n 250000 -f bin -s dword -o $outputFile

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        pip install sp80022suite numpy scipy

    - name: Run NIST statistical tests
      shell: pwsh
      run: |
        python -c @'
        import sp80022suite
        import sys
        import os

        test_file = os.path.join(os.getcwd(), 'test_data.bin')
        with open(test_file, 'rb') as f:
            data = f.read()

        print(f'Read {len(data)} bytes from {test_file}')

        bits = []
        for byte in data:
            for bit_pos in range(8):
                bits.append((byte >> (7 - bit_pos)) & 1)

        bits = bits[:1000000]
        bit_str = ''.join(str(b) for b in bits)

        # Discover all available test functions in sp80022suite
        all_funcs = [x for x in dir(sp80022suite) if not x.startswith('_') and callable(getattr(sp80022suite, x))]
        print(f'Available sp80022suite functions: {all_funcs}')
        print()

        # Map of known test names (try multiple naming conventions)
        test_candidates = {
            'Frequency (Monobit)':     ['frequency', 'monobit_test', 'monobit'],
            'Block Frequency':         ['block_frequency', 'frequency_within_block', 'block_frequency_test'],
            'Runs':                    ['runs', 'runs_test'],
            'Longest Run of Ones':     ['longest_run_of_ones', 'longest_run', 'longest_run_ones', 'longest_run_test'],
            'Rank':                    ['rank', 'binary_matrix_rank', 'rank_test', 'matrix_rank'],
            'Non-Overlapping Template': ['non_overlapping_template_matchings', 'non_overlapping_template_matching'],
            'Overlapping Template':    ['overlapping_template_matchings', 'overlapping_template_matching', 'overlapping_template'],
            'Universal':               ['universal', 'universal_statistical', 'universal_test'],
            'Linear Complexity':       ['linear_complexity', 'linear_complexity_test'],
            'Serial':                  ['serial', 'serial_test'],
            'Approximate Entropy':     ['approximate_entropy', 'approximate_entropy_test'],
            'Cumulative Sums':         ['cumulative_sums', 'cumulative_sums_test', 'cusum'],
            'Random Excursions':       ['random_excursions', 'random_excursion', 'random_excursions_test'],
            'Random Excursions Variant': ['random_excursions_variant', 'random_excursion_variant', 'random_excursions_variant_test'],
        }

        failed = []
        ran = 0

        for test_name, candidates in test_candidates.items():
            func = None
            for cand in candidates:
                if hasattr(sp80022suite, cand):
                    func = getattr(sp80022suite, cand)
                    break

            if func is None:
                print(f'{test_name:30s}  SKIPPED (not found in package)')
                continue

            try:
                p_value = func(bit_str)
                # Some tests return a tuple or list
                if isinstance(p_value, (tuple, list)):
                    p_value = p_value[0]
                    if isinstance(p_value, (tuple, list)):
                        p_value = p_value[0]

                p_value = float(p_value)
                status = 'PASS' if p_value >= 0.01 else 'FAIL'
                print(f'{test_name:30s}  p={p_value:.6f}  {status}')
                ran += 1
                if p_value < 0.01:
                    failed.append((test_name, p_value))
            except Exception as e:
                print(f'{test_name:30s}  ERROR: {e}')
                failed.append((test_name, None))
                ran += 1

        print()
        print(f'Ran {ran} tests, {len(failed)} failed')
        if failed:
            for name, p in failed:
                if p is not None:
                    print(f'  FAILED: {name} (p={p:.6f})')
                else:
                    print(f'  ERROR:  {name}')
            sys.exit(1)
        else:
            print('All tests PASSED')
        '@

    - name: Create artifacts directory
      run: |
        New-Item -ItemType Directory -Force -Path ${{env.ARTIFACTS_DIR}}

    - name: Copy additional files from repository
      run: |
        Copy-Item -Path "README.md" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "LICENSE" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "randpp.h" -Destination "${{env.ARTIFACTS_DIR}}" -Force

    - name: Compress build output
      run: |
        $outputPath = ".\src\x64\${{env.BUILD_CONFIGURATION}}"
        $zipPath = "${{env.ARTIFACTS_DIR}}\build-artifacts.zip"

        if (Test-Path $outputPath) {
            Write-Host "Копируем бинарные файлы в директорию артефактов"
            Copy-Item -Path "$outputPath\*.exe" -Destination "${{env.ARTIFACTS_DIR}}" -Recurse -Force
            Write-Host "Архивируем все файлы из директории артефактов в $zipPath"
            Compress-Archive -Path "${{env.ARTIFACTS_DIR}}\*" -DestinationPath $zipPath -Force
            Write-Host "Архив успешно создан: $zipPath"
        } else {
            Write-Error "Выходная директория не найдена: $outputPath"
            exit 1
        }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Сборка проекта Rand++

          **Версия:** v${{ github.run_number }}
          **Дата сборки:** ${{ github.event.head_commit.timestamp }}
          **Коммит:** ${{ github.sha }}
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip
        draft: false
        prerelease: false

    - name: Upload Asset to existing Release
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip

    - name: Cleanup
      if: always()
      run: |
        if (Test-Path ${{env.ARTIFACTS_DIR}}) {
            Remove-Item -Path ${{env.ARTIFACTS_DIR}} -Recurse -Force
            Write-Host "Временные файлы очищены"
        }
        if (Test-Path "test_data.bin") {
            Remove-Item -Path "test_data.bin" -Force
        }
