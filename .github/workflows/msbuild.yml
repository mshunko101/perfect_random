name: MSBuild with Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '**.sln'
      - '**.vcxproj'
      - 'tests/**'
      - '.github/workflows/msbuild.yml'
  release:
    types: [created]

env:
  SOLUTION_FILE_PATH: ./src/Rand++.sln
  BUILD_CONFIGURATION: Release
  ARTIFACTS_DIR: artifacts

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: |
      github.event_name != 'release' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build solution
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Run C++ unit tests
      run: |
        $testExe = ".\src\x64\${{env.BUILD_CONFIGURATION}}\cpp_tests.exe"
        if (-not (Test-Path $testExe)) {
          Write-Host "cpp_tests.exe не найден в $testExe — ищем рекурсивно..."
          $found = Get-ChildItem -Path ".\src" -Filter "cpp_tests.exe" -Recurse | Select-Object -First 1
          if ($found) {
            $testExe = $found.FullName
            Write-Host "Найден: $testExe"
          } else {
            Write-Error "cpp_tests.exe не найден!"
            exit 1
          }
        }
        Write-Host "Running: $testExe"
        & $testExe
        if ($LASTEXITCODE -ne 0) {
          Write-Error "C++ unit tests FAILED (exit code: $LASTEXITCODE)"
          exit 1
        }
        Write-Host "C++ unit tests PASSED"

    - name: Generate test data (CLI mode)
      run: |
        $outputFile = Join-Path $PWD "test_data.bin"
        Write-Host "Generating test data to: $outputFile"
        .\src\x64\${{env.BUILD_CONFIGURATION}}\Rand++.exe -a 0 -b 256 -n 134217728 -p 42 -f bin -s 8 -o $outputFile

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        pip install sp80022suite numpy scipy

    - name: Run NIST statistical tests
      run: |
        python tests/run_nist_tests.py test_data.bin

    - name: Create artifacts directory
      run: |
        New-Item -ItemType Directory -Force -Path ${{env.ARTIFACTS_DIR}}

    - name: Copy additional files from repository
      run: |
        Copy-Item -Path "README.md" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "LICENSE" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "perfect_random.hpp" -Destination "${{env.ARTIFACTS_DIR}}" -Force

    - name: Compress build output
      run: |
        $zipPath = "${{env.ARTIFACTS_DIR}}\perfect-random.zip"

        $exeFiles = @()
        $expectedPath = ".\src\x64\${{env.BUILD_CONFIGURATION}}"
        if (Test-Path $expectedPath) {
            $exeFiles = Get-ChildItem -Path $expectedPath -Filter "*.exe" -Recurse
        }
        if ($exeFiles.Count -eq 0) {
            Write-Host "Не найдено в $expectedPath — ищем рекурсивно по src..."
            $exeFiles = Get-ChildItem -Path ".\src" -Filter "*.exe" -Recurse
        }

        if ($exeFiles.Count -eq 0) {
            Write-Error "Ни одного .exe не найдено!"
            exit 1
        }

        foreach ($f in $exeFiles) {
            Write-Host "Найден: $($f.FullName)"
            Copy-Item -Path $f.FullName -Destination "${{env.ARTIFACTS_DIR}}" -Force
        }

        Compress-Archive -Path "${{env.ARTIFACTS_DIR}}\*" -DestinationPath $zipPath -Force
        Write-Host "Архив создан: $zipPath"
        Write-Host "Содержимое архива:"
        [System.IO.Compression.ZipFile]::OpenRead($zipPath).Entries |
            ForEach-Object { Write-Host "  $($_.FullName)" }

    - name: Calculate short commit hash
      id: short-sha
      run: |
        $sha = "${{ github.sha }}"
        $short = $sha.Substring(0, 7)
        echo "SHORT_SHA=$short" >> $env:GITHUB_OUTPUT

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Сборка проекта Rand++

          **Версия:** v${{ github.run_number }}
          **Дата сборки:** ${{ github.event.head_commit.timestamp }}
          **Коммит:** `${{ steps.short-sha.outputs.SHORT_SHA }}`
          **Полный SHA:** ${{ github.sha }}
        files: ${{env.ARTIFACTS_DIR}}/perfect-random.zip
        draft: false
        prerelease: false

    - name: Upload Asset to existing Release
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        files: ${{env.ARTIFACTS_DIR}}/perfect-random.zip

    - name: Cleanup
      if: always()
      run: |
        if (Test-Path ${{env.ARTIFACTS_DIR}}) {
            Remove-Item -Path ${{env.ARTIFACTS_DIR}} -Recurse -Force
            Write-Host "Временные файлы очищены"
        }
        if (Test-Path "test_data.bin") {
            Remove-Item -Path "test_data.bin" -Force
        }
