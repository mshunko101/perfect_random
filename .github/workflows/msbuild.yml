name: MSBuild with Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '**.sln'
      - '**.vcxproj'
      - '.github/workflows/msbuild.yml'
  release:
    types: [created]

env:
  SOLUTION_FILE_PATH: ./src/Rand++.sln
  BUILD_CONFIGURATION: Release
  ARTIFACTS_DIR: artifacts

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    if: |
      github.event_name != 'release' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build solution
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Generate test data (CLI mode)
      run: |
        .\src\x64\Release\Rand++.exe -n 250000 -f bin -s dword -o test_data.bin

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        pip install sp80022suite numpy

    - name: Run NIST statistical tests
      shell: pwsh
      run: |
        python -c "
        import sp80022suite
        import sys

        with open('test_data.bin', 'rb') as f:
            data = f.read()

        bits = []
        for byte in data:
            for bit_pos in range(8):
                bits.append((byte >> (7 - bit_pos)) & 1)

        bits = bits[:1000000]
        bit_str = ''.join(str(b) for b in bits)

        tests = {
            'Frequency':          sp80022suite.frequency,
            'BlockFrequency':     sp80022suite.block_frequency,
            'Runs':               sp80022suite.runs,
            'LongestRunOnes':     sp80022suite.longest_run_of_ones,
            'Rank':               sp80022suite.rank,
            'NonOverlappingTpl':  sp80022suite.non_overlapping_template,
            'OverlappingTpl':     sp80022suite.overlapping_template,
            'Universal':          sp80022suite.universal,
            'LinearComplexity':   sp80022suite.linear_complexity,
            'Serial':             sp80022suite.serial,
            'ApproxEntropy':      sp80022suite.approximate_entropy,
            'CumulativeSums':     sp80022suite.cumulative_sums,
            'RandomExcursions':   sp80022suite.random_excursions,
            'RandomExcursionsVar':sp80022suite.random_excursions_variant,
        }

        failed = []
        for name, test_fn in tests.items():
            try:
                p = test_fn(bit_str)
                status = 'PASS' if p >= 0.01 else 'FAIL'
                print(f'{name:25s} p={p:.6f}  {status}')
                if p < 0.01:
                    failed.append((name, p))
            except Exception as e:
                print(f'{name:25s} ERROR: {e}')
                failed.append((name, None))

        print()
        if failed:
            print(f'FAILED: {len(failed)} test(s)')
            for name, p in failed:
                if p is not None:
                    print(f'  {name}: p={p:.6f}')
                else:
                    print(f'  {name}: ERROR')
            sys.exit(1)
        else:
            print(f'All {len(tests)} tests PASSED')
        "

    - name: Create artifacts directory
      run: |
        New-Item -ItemType Directory -Force -Path ${{env.ARTIFACTS_DIR}}

    - name: Copy additional files from repository
      run: |
        Copy-Item -Path "./docs/README.md" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "LICENSE" -Destination "${{env.ARTIFACTS_DIR}}" -Force
        Copy-Item -Path "randpp.h" -Destination "${{env.ARTIFACTS_DIR}}" -Force

    - name: Compress build output
      run: |
        $outputPath = ".\src\x64\${{env.BUILD_CONFIGURATION}}"
        $zipPath = "${{env.ARTIFACTS_DIR}}\build-artifacts.zip"

        if (Test-Path $outputPath) {
            Write-Host "Копируем бинарные файлы в директорию артефактов"
            Copy-Item -Path "$outputPath\*.exe" -Destination "${{env.ARTIFACTS_DIR}}" -Recurse -Force
            Write-Host "Архивируем все файлы из директории артефактов в $zipPath"
            Compress-Archive -Path "${{env.ARTIFACTS_DIR}}\*" -DestinationPath $zipPath -Force
            Write-Host "Архив успешно создан: $zipPath"
        } else {
            Write-Error "Выходная директория не найдена: $outputPath"
            exit 1
        }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Сборка проекта Rand++

          **Версия:** v${{ github.run_number }}
          **Дата сборки:** ${{ github.event.head_commit.timestamp }}
          **Коммит:** ${{ github.sha }}
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip
        draft: false
        prerelease: false

    - name: Upload Asset to existing Release
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.MSHUNKO_TOKEN }}
      with:
        files: ${{env.ARTIFACTS_DIR}}/build-artifacts.zip

    - name: Cleanup
      if: always()
      run: |
        if (Test-Path ${{env.ARTIFACTS_DIR}}) {
            Remove-Item -Path ${{env.ARTIFACTS_DIR}} -Recurse -Force
            Write-Host "Временные файлы очищены"
        }
