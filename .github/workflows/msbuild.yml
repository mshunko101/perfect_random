name: MSBuild with Release

on:
  push:
    branches: ["main"]
    paths:
      - "УТИЛИТЫ/**"
      - "*.h*"
      - "**/*.sln"
      - "**/*.vcxproj"
      - "ТЕСТЫ/**"
      - ".github/workflows/msbuild.yml"
  release:
    types: [created]

env:
  SOLUTION_FILE_PATH: ./УТИЛИТЫ/Rand++.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  ARTIFACTS_DIR: artifacts

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build solution
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Run C++ unit tests
        run: |
          $testExe = ".\ТЕСТЫ\${{ env.BUILD_PLATFORM }}\${{ env.BUILD_CONFIGURATION }}\cpp_tests.exe"
          if (-not (Test-Path $testExe)) {
            Write-Host "cpp_tests.exe не найден в $testExe — ищем рекурсивно..."
            $found = Get-ChildItem -Path ".\ТЕСТЫ" -Filter "cpp_tests.exe" -Recurse | Select-Object -First 1
            if ($found) {
              $testExe = $found.FullName
              Write-Host "Найден: $testExe"
            } else {
              Write-Error "cpp_tests.exe не найден!"
              exit 1
            }
          }
          Write-Host "Running: $testExe"
          & $testExe
          if ($LASTEXITCODE -ne 0) {
            Write-Error "C++ unit tests FAILED (exit code: $LASTEXITCODE)"
            exit 1
          }
          Write-Host "C++ unit tests PASSED"

      # ── Поиск Rand++.exe ──────────────────────────────────────
      - name: Locate Rand++.exe
        id: find-gen
        run: |
          $genExe = Get-ChildItem -Path ".\УТИЛИТЫ" -Filter "Rand++.exe" -Recurse | Select-Object -First 1 | ForEach-Object { $_.FullName }
          if (-not $genExe) { Write-Error "Rand++.exe не найден!"; exit 1 }
          Write-Host "Rand++.exe: $genExe"
          "GEN_EXE=$genExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ASCII

      # ═══════════════════════════════════════════════════════════
      #  Генерация тестовых данных — 3 режима × 2 движка = 6 файлов
      # ═══════════════════════════════════════════════════════════

      # ── C++ Standard ──────────────────────────────────────────
      - name: Generate test data — C++ Standard
        run: |
          $out = Join-Path $PWD "test_cpp_std.bin"
          & ${{ steps.find-gen.outputs.GEN_EXE }} -a 0 -b 256 -n 2000000 -p 73.8 -f bin -s 8 -e cpp-std -o $out
          if (-not (Test-Path $out)) { Write-Error "Файл не создан: $out"; exit 1 }
          Write-Host "Generated: $out ($((Get-Item $out).Length) bytes)"

      # ── C++ Crypto ────────────────────────────────────────────
      - name: Generate test data — C++ Crypto
        run: |
          $out = Join-Path $PWD "test_cpp_crypto.bin"
          & ${{ steps.find-gen.outputs.GEN_EXE }} -a 0 -b 256 -n 2000000 -p 73.8 -f bin -s 8 -e cpp-crypto -o $out
          if (-not (Test-Path $out)) { Write-Error "Файл не создан: $out"; exit 1 }
          Write-Host "Generated: $out ($((Get-Item $out).Length) bytes)"

      # ── C++ MonteCarlo ────────────────────────────────────────
      - name: Generate test data — C++ MonteCarlo
        run: |
          $out = Join-Path $PWD "test_cpp_mc.bin"
          & ${{ steps.find-gen.outputs.GEN_EXE }} -a 0 -b 256 -n 2000000 -p 73.8 -f bin -s 8 -e cpp-mc -o $out
          if (-not (Test-Path $out)) { Write-Error "Файл не создан: $out"; exit 1 }
          Write-Host "Generated: $out ($((Get-Item $out).Length) bytes)"

      # ── C Standard ────────────────────────────────────────────
      - name: Generate test data — C Standard
        run: |
          $out = Join-Path $PWD "test_c_std.bin"
          & ${{ steps.find-gen.outputs.GEN_EXE }} -a 0 -b 256 -n 2000000 -p 73.8 -f bin -s 8 -e c-std -o $out
          if (-not (Test-Path $out)) { Write-Error "Файл не создан: $out"; exit 1 }
          Write-Host "Generated: $out ($((Get-Item $out).Length) bytes)"

      # ── C Crypto ──────────────────────────────────────────────
      - name: Generate test data — C Crypto
        run: |
          $out = Join-Path $PWD "test_c_crypto.bin"
          & ${{ steps.find-gen.outputs.GEN_EXE }} -a 0 -b 256 -n 2000000 -p 73.8 -f bin -s 8 -e c-crypto -o $out
          if (-not (Test-Path $out)) { Write-Error "Файл не создан: $out"; exit 1 }
          Write-Host "Generated: $out ($((Get-Item $out).Length) bytes)"

      # ── C MonteCarlo ──────────────────────────────────────────
      - name: Generate test data — C MonteCarlo
        run: |
          $out = Join-Path $PWD "test_c_mc.bin"
          & ${{ steps.find-gen.outputs.GEN_EXE }} -a 0 -b 256 -n 2000000 -p 73.8 -f bin -s 8 -e c-mc -o $out
          if (-not (Test-Path $out)) { Write-Error "Файл не создан: $out"; exit 1 }
          Write-Host "Generated: $out ($((Get-Item $out).Length) bytes)"

      # ═══════════════════════════════════════════════════════════
      #  NIST SP 800-22 — 6 прогонов
      # ═══════════════════════════════════════════════════════════

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install sp80022suite numpy scipy

      - name: Run NIST — C++ Standard
        run: python tests/run_nist_tests.py test_cpp_std.bin

      - name: Run NIST — C++ Crypto
        run: python tests/run_nist_tests.py test_cpp_crypto.bin

      - name: Run NIST — C++ MonteCarlo
        run: python tests/run_nist_tests.py test_cpp_mc.bin

      - name: Run NIST — C Standard
        run: python tests/run_nist_tests.py test_c_std.bin

      - name: Run NIST — C Crypto
        run: python tests/run_nist_tests.py test_c_crypto.bin

      - name: Run NIST — C MonteCarlo
        run: python tests/run_nist_tests.py test_c_mc.bin

      # ═══════════════════════════════════════════════════════════
      #  Артефакты и релиз
      # ═══════════════════════════════════════════════════════════

      - name: Create artifacts directory
        run: New-Item -ItemType Directory -Force -Path ${{ env.ARTIFACTS_DIR }}

      - name: Copy additional files from repository
        run: |
          Copy-Item -Path "README.md" -Destination "${{ env.ARTIFACTS_DIR }}" -Force
          Copy-Item -Path "LICENSE" -Destination "${{ env.ARTIFACTS_DIR }}" -Force
          Copy-Item -Path "ВЕРСИИ\perfect_random.hpp" -Destination "${{ env.ARTIFACTS_DIR }}" -Force
          Copy-Item -Path "ВЕРСИИ\perfect_random_c.h" -Destination "${{ env.ARTIFACTS_DIR }}" -Force
          Copy-Item -Path "ВЕРСИИ\ZetaCalc.h" -Destination "${{ env.ARTIFACTS_DIR }}" -Force
          if (Test-Path "PERFECT_RANDOM_LOGO.JPEG") {
            Copy-Item -Path "PERFECT_RANDOM_LOGO.JPEG" -Destination "${{ env.ARTIFACTS_DIR }}" -Force
          } else {
            Write-Warning "PERFECT_RANDOM_LOGO.JPEG не найден — пропускаем"
          }

      - name: Compress build output
        run: |
          $zipPath = "${{ env.ARTIFACTS_DIR }}\perfect-random.zip"
          $expectedPath = ".\УТИЛИТЫ\${{ env.BUILD_PLATFORM }}\${{ env.BUILD_CONFIGURATION }}"
          $exeFiles = Get-ChildItem -Path $expectedPath -Filter "*.exe" -Recurse -File
          if ($exeFiles.Count -eq 0) {
            $exeFiles = Get-ChildItem -Path ".\УТИЛИТЫ" -Filter "*.exe" -Recurse -File
          }
          if ($exeFiles.Count -eq 0) {
            Write-Error "Ни одного .exe не найдено!"
            exit 1
          }
          foreach ($f in $exeFiles) {
            Copy-Item -Path $f.FullName -Destination "${{ env.ARTIFACTS_DIR }}" -Force
          }
          Compress-Archive -Path "${{ env.ARTIFACTS_DIR }}\*" -DestinationPath $zipPath -Force
          Write-Host "Архив создан: $zipPath"
          [System.IO.Compression.ZipFile]::OpenRead($zipPath).Entries | ForEach-Object { Write-Host "  $($_.FullName)" }

      # ── ТОЛЬКО при событии release: создать релиз и загрузить ассеты ──
      - name: Calculate short commit hash
        id: short-sha
        if: github.event_name == 'release'
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          "SHORT_SHA=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: Release ${{ github.event.release.tag_name }}
          body: |
            Сборка проекта Rand++ / perfect_random

            **Версия:** ${{ github.event.release.tag_name }}
            **Коммит:** `${{ steps.short-sha.outputs.SHORT_SHA }}`
            **Полный SHA:** ${{ github.sha }}

            В архиве вы можете найти hpp, h версии библиотеки, а так же
            README.md, лицензию и logo.
            Утилита ZetaCalc - анализ предельно допустимой нагрузки.
            Подпись sha256 выполняется после прохождения тестов BigCrush, PractRand.

            **Тестирование CI:**
            - NIST SP 800-22: 6 прогонов (3 режима × 2 движка) — все PASS
            - C++ unit tests: 131 тестов — все PASS
          files: |
            ${{ env.ARTIFACTS_DIR }}/perfect-random.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          if (Test-Path ${{ env.ARTIFACTS_DIR }}) {
            Remove-Item -Path ${{ env.ARTIFACTS_DIR }} -Recurse -Force
          }
          foreach ($file in @(
            "test_cpp_std.bin","test_cpp_crypto.bin","test_cpp_mc.bin",
            "test_c_std.bin","test_c_crypto.bin","test_c_mc.bin"
          )) {
            if (Test-Path $file) { Remove-Item -Path $file -Force }
          }
